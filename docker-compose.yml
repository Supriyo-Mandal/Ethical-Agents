services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ethical-agents-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      OPENROUTER_API_KEY_1: ${OPENROUTER_API_KEY_1:-}
      OPENROUTER_API_KEY_2: ${OPENROUTER_API_KEY_2:-}
      OPENROUTER_API_KEY_3: ${OPENROUTER_API_KEY_3:-}
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GROQ_API_KEY_1: ${GROQ_API_KEY_1:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      GROQ_API_KEY_3: ${GROQ_API_KEY_3:-}
    networks:
      - ethical-agents-private
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ethical-agents-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - ethical-agents-private
    restart: unless-stopped

networks:
  ethical-agents-private:
    driver: bridge

volumes:
  ethical_agents_postgres_data: